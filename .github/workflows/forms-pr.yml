name: Forms PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    name: Detect forms coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_forms: ${{ steps.detect.outputs.run_forms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --no-renames --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")
          complete=true
          required_changed=false
          for required in apps/web/app/components/FormsNotifications.vue apps/web/shared/utils/forms-notification-client.ts apps/web/tests/forms-notification-client.test.ts apps/web/tests/fixtures/check-forms-static-notifications.mjs supabase/functions/_shared/limited_body.ts apps/api/src/form_ingress.rs apps/web/app/components/WebsiteForms.vue apps/web/server/utils/forms-pilot.ts apps/web/server/api/forms/pilot-eligibility.get.ts apps/web/tests/forms-pilot-auth.test.ts apps/web/tests/forms-pilot-eligibility.test.ts apps/web/tests/forms-confirm-gate.test.ts apps/web/tests/fixtures/check-forms-pilot.mjs apps/web/tests/fixtures/check-forms-api-cors.mjs apps/web/tests/fixtures/check-forms-pilot-api-cors.mjs scripts/test-forms-pilot-http.sh supabase/operations/forms-pilot-receipt.sql supabase/tests/fixtures/forms-pilot-scope/receipt-pg17.py supabase/tests/fixtures/forms-pilot-scope/seed.sql supabase/tests/fixtures/forms-pilot-scope/postgrest-check.mjs supabase/tests/website-forms.test.mjs supabase/tests/forms-client-admission.test.mjs supabase/tests/forms-host-challenge-quota.test.mjs supabase/tests/forms-activation-fixture.test.mjs supabase/tests/fixtures/forms-activation/host-proof-regrant.sql supabase/tests/fixtures/forms-activation/host-proof-rollback.sql supabase/migrations/20261201000000_forms_pilot_scope.sql supabase/rollbacks/20261201000000_forms_pilot_scope_disable.sql supabase/tests/forms-pilot-scope.test.mjs; do
            if [[ ! -f "$required" ]]; then complete=false; fi
            if grep -Fxq "$required" <<< "$changed"; then required_changed=true; fi
          done
          if [[ "$complete" == true ]]; then
            echo "run_forms=true" >> "$GITHUB_OUTPUT"
          elif [[ "$required_changed" == true ]] || grep -Eq '^(docs/forms/|supabase/operations/forms-pilot-receipt\.sql$|supabase/rollbacks/20261122|supabase/functions/form-(submit|verify|notifications|confirm-recipient)/|supabase/migrations/20261122|supabase/migrations/20261128000000_forms_host_challenge_quota\.sql$|supabase/migrations/20261201000000_forms_pilot_scope\.sql$|supabase/tests/(website-forms|forms-client-admission|forms-host-challenge-quota|forms-activation-fixture|forms-pilot-scope)\.test\.mjs$|supabase/tests/fixtures/(forms-host-quota-concurrency\.|forms-activation/|forms-pilot-scope/)|apps/api/src/form_ingress\.rs$|apps/web/app/(components/WebsiteForms\.vue|utils/forms-csv\.ts|pages/forms/confirm\.vue)$|apps/web/server/(api/forms/|utils/forms-pilot\.ts$)|apps/web/tests/(forms-(csv|pilot|confirm)|fixtures/(forms|check-forms)))' <<< "$changed"; then
            echo 'Forms-specific files changed but the forms implementation is incomplete' >&2
            exit 1
          else
            echo 'Forms implementation incomplete and no forms-specific files changed; skipping forms checks.'
            echo "run_forms=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test scope detector when available
        shell: bash
        run: |
          if [[ -f .github/scripts/test-forms-ci-scope.py ]]; then
            python3 .github/scripts/test-forms-ci-scope.py
          fi

  edge:
    needs: scope
    if: needs.scope.outputs.run_forms == 'true'
    name: Forms Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Test forms handlers
        run: >-
          deno test --allow-env --allow-net
          supabase/functions/form-verify/index_test.ts
          supabase/functions/form-confirm-recipient/index_test.ts
          supabase/functions/form-notifications/index_test.ts

  database:
    needs: scope
    if: needs.scope.outputs.run_forms == 'true'
    name: Forms database fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Test forms migrations and admission
        run: node --test tests/website-forms.test.mjs tests/forms-client-admission.test.mjs tests/forms-host-challenge-quota.test.mjs tests/forms-activation-fixture.test.mjs tests/forms-pilot-scope.test.mjs
      - name: Test notification claim and shutdown in PostgreSQL 17
        run: |
          docker pull public.ecr.aws/supabase/postgres:17.11.0.004
          python3 tests/forms-delivery-claim-local.py
          python3 tests/forms-delivery-scoped-claim-local.py

  api:
    needs: scope
    if: needs.scope.outputs.run_forms == 'true'
    name: API library tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Test API library
        run: cargo test --locked -p htp-api --lib

  web:
    needs: scope
    if: needs.scope.outputs.run_forms == 'true'
    name: Web and forms browser fixtures
    # Playwright 1.56.1 does not support the moving ubuntu-latest 26.04 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test inbox component in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm run fixture:forms:serve > "$RUNNER_TEMP/forms-vite.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4177/tests/fixtures/forms.html > /dev/null; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then cat "$RUNNER_TEMP/forms-vite.log"; exit 1; fi
            sleep 1
          done
          npm run fixture:forms:check
          node tests/fixtures/check-forms-pilot.mjs
          node tests/fixtures/check-forms-static.mjs
          node tests/fixtures/check-forms-static-owner.mjs
          node tests/fixtures/check-forms-static-notifications.mjs
      - name: Test actual API cross-origin behavior in Chromium
        working-directory: .
        run: cargo test --locked -p htp-api --lib form_ingress::tests::browser_cors_against_actual_api -- --ignored --nocapture
      - name: Test pilot API through disposable PostgreSQL and PostgREST
        working-directory: .
        run: scripts/test-forms-pilot-http.sh

      - name: Test read-only pilot receipts on disposable PostgreSQL
        working-directory: .
        run: python3 supabase/tests/fixtures/forms-pilot-scope/receipt-pg17.py
