name: Forms forwarder checks

on:
  pull_request:
    paths:
      - "apps/forms-forwarder/**"
      - ".github/workflows/forms-forwarder.yml"

permissions:
  contents: read

jobs:
  forwarder:
    name: Forwarder typecheck, tests and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/forms-forwarder
    env:
      WRANGLER_SEND_METRICS: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/forms-forwarder/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npm run check
      - run: npm test
      - run: npm run deploy:dry-run
