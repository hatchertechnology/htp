app = "htp-web-kerry-hatcher"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  NUXT_API_BASE_URL = "https://htp-api-kerry-hatcher.fly.dev"
  NUXT_PUBLIC_API_BASE_URL = "https://htp-api-kerry-hatcher.fly.dev"
  NUXT_PUBLIC_SUPABASE_URL = "https://raxuvdbdfmmtpqjcafcq.supabase.co"
  NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Loul540Y3Oj_qIojV0kr0w_Jq5vhn5H"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
