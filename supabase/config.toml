project_id = "htp"

[auth]
site_url = "https://htp.hatchtech.dev"

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[functions.google-sync]
# Cron authenticates with a separate secret checked inside the handler.
verify_jwt = false

[functions.bing-sync]
verify_jwt = false

[functions.form-submit]
# Visitors have no HTP account; the handler enforces verified origins.
verify_jwt = false
